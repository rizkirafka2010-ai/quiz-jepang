<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bahasa Jepang</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🇯🇵 Quiz Bahasa Jepang</h1>

        <p>Level N5</p>

        <div class="info">
            <span>❤️ ❤️ ❤️</span>
            <span>⭐ Skor: 0</span>
            <span>⏱️ 15</span>
        </div>

        <div class="question">
            <p>Soal 1</p>
            <h2>「これは なんですか。」</h2>
        </div>
        <div id="feedback"></div>
        <div class="answers">

            <button class="answer">A. Ini apa?</button>

            <button class="answer">B. Siapa ini?</button>

            <button class="answer">C. Di mana ini?</button>

            <button class="answer">D. Apa kabar?</button>

        </div>

        <button class="next">Soal Berikutnya →</button>
         
        <script src="script.js"></script>

    </div>

</body>
</html>
